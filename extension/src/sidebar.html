<!DOCTYPE html>
<html lang="en">
<head>
  <style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    margin: 0;
    padding: 8px;
    background-color: #f0f2f5;
    color: #1c1e21;
}

header {
    padding-bottom: 8px;
    border-bottom: 1px solid #ccc;
    margin-bottom: 8px;
}

h1 {
    font-size: 16px;
    margin: 0;
}

/* Tree styles */
#tree-container ul {
    list-style-type: none;
    padding-left: 16px;
    margin: 0;
}

#tree-container li {
    padding: 4px 0;
}

.tree-node {
    display: flex;
    align-items: center;
    cursor: pointer;
    border-radius: 4px;
    padding: 2px 4px;
}

.tree-node:hover {
    background-color: #e4e6eb;
}

.tree-node img {
    width: 16px;
    height: 16px;
    margin-right: 8px;
    flex-shrink: 0;
}

.tree-node .title {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
  </style>
</head>
<body>
  <main id="tree-container">
  </main>

  <script src="sidebar.js" type="module"></script>
</body>
